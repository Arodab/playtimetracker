plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.4'
	annotationProcessor 'org.projectlombok:lombok:1.18.4'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
}

group = 'com.playtimetracker'
version = '1.2.0'
sourceCompatibility = '11'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

// The plugin's display name is generated rather than written in the @PluginDescriptor, so a dev
// build can carry a " (dev)" suffix and sit in the plugin list next to the hub copy without the
// two being mistaken for each other. Annotation values must be compile-time constants, which a
// `static final String` initialised from a literal is — so this is inlined at compile time.
//
// `gradlew run` passes -PdevBuild (see launch-dev-client.cmd). A plain `gradlew build` does not,
// so a shipped jar always gets the clean name without anyone having to remember to strip it.
def pluginBaseName = 'Play Time Tracker'
def generatedNameDir = layout.buildDirectory.dir('generated/sources/pluginname/java/main')

tasks.register('generatePluginName') {
	def isDev = project.hasProperty('devBuild')
	def outDir = generatedNameDir.get().asFile
	inputs.property('devBuild', isDev)
	inputs.property('baseName', pluginBaseName)
	outputs.dir(outDir)
	doLast {
		def pkgDir = new File(outDir, 'com/playtimetracker')
		pkgDir.mkdirs()
		new File(pkgDir, 'PluginName.java').text = """package com.playtimetracker;

/** Generated by the build - see the generatePluginName task in build.gradle. Do not edit. */
public final class PluginName
{
\tpublic static final String VALUE = "${pluginBaseName}${isDev ? ' (dev)' : ''}";

\tprivate PluginName()
\t{
\t}
}
"""
	}
}

sourceSets.main.java.srcDir generatedNameDir
tasks.named('compileJava') { dependsOn 'generatePluginName' }

// Belt and braces: a dev-named jar must never be publishable, however the build was invoked.
tasks.named('jar') {
	doFirst {
		if (project.hasProperty('devBuild')) {
			throw new GradleException('Refusing to build a jar with -PdevBuild: that would ship the "(dev)" plugin name.')
		}
	}
}

// Launches a RuneLite dev client with this plugin loaded (uses your normal ~/.runelite).
// Developer mode is required so RuneLite loads the plugin.
tasks.register('run', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	getMainClass().set('com.playtimetracker.PlayTimePluginTest')
	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

// Renders the side-panel chart to a PNG without launching a client, so its layout can be
// eyeballed during development. Test-only; nothing here is packaged.
tasks.register('renderChart', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	getMainClass().set('com.playtimetracker.ChartRender')
	args "${buildDir}/chart-preview.png"
}

// Renders the whole side panel, one PNG per tab, without launching a client. Test-only.
tasks.register('renderPanel', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	getMainClass().set('com.playtimetracker.PanelRender')
	args "${buildDir}"
}

// Replays the minute-quantised baseline against per-tick tracking to prove no phantom
// off-client time is reported. Test-only.
tasks.register('externalNoise', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	getMainClass().set('com.playtimetracker.ExternalNoise')
}
